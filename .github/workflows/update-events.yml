name: Update Event Dates & Discover New Events

on:
  schedule:
    # 毎週月曜 9:00 JST (= 0:00 UTC)
    - cron: "0 0 * * 1"
  workflow_dispatch:

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Run event updater (date refresh + new event discovery)
        run: node scripts/scrape-events.mjs --discover

      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git diff --quiet || (
            git add lib/events.ts &&
            git commit -m "chore: auto-update events (dates + new discovery) [skip ci]" &&
            git push
          )
